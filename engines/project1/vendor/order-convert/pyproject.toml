[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "order-convert"
version = "1.0.0"
description = "Order Excel to 店小秘 / 店管家 converter"
requires-python = ">=3.10"
dependencies = [
  "openpyxl>=3.1.0",
  "xlrd==2.0.2",
  "xlwt>=1.3.0",
  "pypinyin>=0.50.0",
  "PyYAML>=6.0",
  "xlutils>=2.0.0",
]

[project.scripts]
order-convert = "order_convert.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
order_convert = ["templates/*", "resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
